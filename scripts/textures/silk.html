<!doctype html>
<html>
  <body style="margin: 0; background: #000">
    <canvas id="c"></canvas>
    <script>
      // Original brand textures rendered with a fragment shader (no stock, no licence issues).
      // window.render({ w, h, seed, mode: 'silk' | 'leopard' | 'linen', pattern }) → PNG data URL
      const VERTEX = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
      const FRAGMENT = `
precision highp float;
varying vec2 uv;
uniform vec2 res; uniform float seed; uniform sampler2D pat; uniform float mode;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)) + seed*17.13) * 43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p*=2.0; a*=.5; } return v; }

// Draped silk: long folds in one main direction, a few sharper creases, gentle warp.
float heightAt(vec2 q){
  vec2 r = mat2(0.866, -0.5, 0.5, 0.866) * q;
  float warp = fbm(q*0.45 + seed) * 2.4;
  float f1 = sin(r.x*2.4 + warp);
  float f2 = sin(r.x*4.9 + warp*1.3 + 1.7);
  float crease = pow(1. - abs(sin(r.x*1.25 + warp*0.8 + r.y*0.35)), 4.);
  return f1*0.5 + f2*0.16 + crease*0.42 + fbm(q*1.1 + 3.)*0.12;
}
void main(){
  vec2 q = (uv - .5) * vec2(res.x/res.y, 1.) * 2.4;
  float e = 0.0025;
  float h = heightAt(q);
  float hx = heightAt(q+vec2(e,0.)) - h, hy = heightAt(q+vec2(0.,e)) - h;
  vec3 n = normalize(vec3(-hx/e*0.95, -hy/e*0.95, 1.));
  vec3 l = normalize(vec3(-0.45, 0.6, 0.65));
  vec3 v = vec3(0.,0.,1.);
  float diff = clamp(dot(n,l)*0.85+0.15, 0., 1.);
  float spec = pow(clamp(dot(reflect(-l,n), v), 0., 1.), 16.);  // satin highlight along folds
  float sheen = pow(1.-clamp(dot(n,v),0.,1.), 2.);
  vec3 base;
  if (mode < 0.5) {            // espresso silk
    base = mix(vec3(0.07,0.04,0.03), vec3(0.42,0.27,0.16), diff*diff);
  } else if (mode < 1.5) {     // leopard silk: the brand pattern draped and lit
    vec2 tuv = (uv + vec2(h*0.05, h*0.035)) * vec2(res.x/res.y, 1.) * 1.5;
    vec3 p = texture2D(pat, fract(tuv)).rgb;
    base = p * (0.12 + 1.0*diff*diff);
  } else {                     // sand linen
    base = mix(vec3(0.62,0.52,0.42), vec3(0.93,0.87,0.79), diff);
    base -= noise(gl_FragCoord.xy*0.9) * 0.05 + noise(vec2(gl_FragCoord.x*0.08, gl_FragCoord.y*1.6)) * 0.04;
  }
  vec3 col = base + spec * (mode < 1.5 ? vec3(0.95,0.78,0.58)*0.55 : vec3(0.14)) + sheen*vec3(0.06,0.04,0.03);
  col += (hash(gl_FragCoord.xy) - .5) * 0.025;            // film grain
  col *= mix(0.72, 1., smoothstep(1.35, 0.35, length(uv-.5)*1.5)); // vignette
  gl_FragColor = vec4(col, 1.);
}`;

      window.render = (params) =>
        new Promise((resolve, reject) => {
          try {
            const W = +params.w || 1200,
              H = +params.h || 1500,
              SEED = +params.seed || 1;
            const MODE = { silk: 0, leopard: 1, linen: 2 }[
              params.mode || "silk"
            ];
            const c = document.createElement("canvas");
            c.width = W;
            c.height = H;
            document.getElementById("c").replaceWith(c);
            c.id = "c";
            const gl = c.getContext("webgl", {
              preserveDrawingBuffer: true,
              antialias: true,
            });
            const sh = (type, src) => {
              const o = gl.createShader(type);
              gl.shaderSource(o, src);
              gl.compileShader(o);
              if (!gl.getShaderParameter(o, gl.COMPILE_STATUS))
                throw new Error(gl.getShaderInfoLog(o));
              return o;
            };
            const pr = gl.createProgram();
            gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERTEX));
            gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAGMENT));
            gl.linkProgram(pr);
            gl.useProgram(pr);
            const b = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, b);
            gl.bufferData(
              gl.ARRAY_BUFFER,
              new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
              gl.STATIC_DRAW,
            );
            const loc = gl.getAttribLocation(pr, "p");
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            gl.uniform2f(gl.getUniformLocation(pr, "res"), W, H);
            gl.uniform1f(gl.getUniformLocation(pr, "seed"), SEED);
            gl.uniform1f(gl.getUniformLocation(pr, "mode"), MODE);
            const draw = () => {
              gl.viewport(0, 0, W, H);
              gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              resolve(c.toDataURL("image/png"));
            };
            if (MODE !== 1) return draw();
            const img = new Image();
            img.onload = () => {
              const t = gl.createTexture();
              gl.bindTexture(gl.TEXTURE_2D, t);
              gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                img,
              );
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
              gl.texParameteri(
                gl.TEXTURE_2D,
                gl.TEXTURE_WRAP_S,
                gl.CLAMP_TO_EDGE,
              );
              gl.texParameteri(
                gl.TEXTURE_2D,
                gl.TEXTURE_WRAP_T,
                gl.CLAMP_TO_EDGE,
              );
              draw();
            };
            img.onerror = () =>
              reject(new Error("pattern image failed to load"));
            img.src = params.pattern;
          } catch (e) {
            reject(String(e));
          }
        });
    </script>
  </body>
</html>
